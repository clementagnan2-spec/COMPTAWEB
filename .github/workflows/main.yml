name: Build Windows .exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Build executable (application de bureau autonome)
        run: >
          pyinstaller --onefile --windowed --name SaisieComptable
          --icon "factory_icon.ico"
          --add-data "plan_comptable.json;."
          --add-data "templates/bilan_template.xls;templates"
          --hidden-import openpyxl
          --hidden-import openpyxl.cell._writer
          --hidden-import bilan_template_data
          --hidden-import etats_financiers_data
          --hidden-import factory_icon_data
          main.py

      - name: Build executable (SERVEUR réseau — accès multi-utilisateur)
        run: >
          pyinstaller --onefile --console --name SaisieComptableServeur
          --icon "factory_icon.ico"
          --add-data "plan_comptable.json;."
          --add-data "templates/bilan_template.xls;templates"
          --hidden-import openpyxl
          --hidden-import openpyxl.cell._writer
          --hidden-import bilan_template_data
          --hidden-import etats_financiers_data
          --hidden-import factory_icon_data
          server.py

      - name: Build executable (CLIENT réseau — poste distant)
        run: >
          pyinstaller --onefile --windowed --name SaisieComptableClient
          --icon "factory_icon.ico"
          --hidden-import factory_icon_data
          client_main.py

      - name: Upload .exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaisieComptable-windows
          path: |
            dist/SaisieComptable.exe
            dist/SaisieComptableServeur.exe
            dist/SaisieComptableClient.exe

      - name: Attach .exe to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SaisieComptable.exe
            dist/SaisieComptableServeur.exe
            dist/SaisieComptableClient.exe
